# Zsh hooks publish the Codex label once per command; no process polling.
setw -g automatic-rename on
setw -g automatic-rename-format '#{?@codex_program,#{@codex_program},#{b:pane_current_command}}'
set -g allow-rename off
set -g window-status-format '#[fg=#908caa,bg=#232136] #I: #W '
set -g window-status-current-format '#[fg=#232136,bg=#f6c177,bold] #I: #W #[default]'
