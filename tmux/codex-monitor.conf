# Prefix + a: live Codex sessions and subagents. q / Escape / Ctrl+Q closes.
bind-key a run-shell -b 'python3 ~/.config/tmux/codex-monitor.py popup --client #{q:client_name} --socket #{q:socket_path}'

# Append static hook-controlled badges to both inactive and active tabs.
set -g window-status-format '#[fg=#908caa,bg=#232136] #I: #{pane_current_command} #[fg=#eb6f92]#{@codex_badge} '
set -g window-status-current-format '#[fg=#232136,bg=#f6c177,bold] #I: #{pane_current_command} #{@codex_badge} #[default]'
