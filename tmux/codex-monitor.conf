# Prefix + a: native Codex agents overview on the shared server.
bind-key a display-popup -E -w 90% -h 75% -d '#{pane_current_path}' \
    -b rounded -s 'bg=#232136,fg=#e0def4' -S 'bg=#232136,fg=#c4a7e7' \
    -T ' Codex agents ' 'codex agents'

# Use the tracked session name even when the CLI's foreground process is node.
set -g window-status-format '#[fg=#908caa,bg=#232136] #I: #{?@codex_active,codex,#{pane_current_command}} #[fg=#eb6f92]#{@codex_badge} '
set -g window-status-current-format '#[fg=#232136,bg=#f6c177,bold] #I: #{?@codex_active,codex,#{pane_current_command}} #{@codex_badge} #[default]'
